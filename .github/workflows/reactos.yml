name: reactos-seu

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: reactos-seu
  cancel-in-progress: false

jobs:
  sistema:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar e baixar ReactOS 0.4.16 (GPL, sem licenca Microsoft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 qemu-utils unzip novnc websockify python3-pil curl
          mkdir -p /tmp/ros
          gh release download 0.4.16-release \
            --repo reactos/reactos \
            --pattern 'ReactOS-0.4.16-i386.zip' \
            --dir /tmp/ros
          unzip -o /tmp/ros/*.zip -d /tmp/ros
          ISO=$(find /tmp/ros -iname '*.iso' -print -quit)
          test -n "$ISO"
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          echo "iso: $ISO ($(du -h "$ISO" | cut -f1))"
          qemu-img create -f qcow2 /tmp/ros/disco.qcow2 2G
          echo "QEMU: $(qemu-system-x86_64 --version | head -1)"

      - name: subir ReactOS em QEMU TCG (sem KVM) + Tailscale + noVNC
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG=/tmp/ros/step3.log
          : > "$LOG"
          DIZ() { echo "$*" >> "$LOG"; echo "$*"; }
          PUBLICAR() {
            python3 - <<'PY' >/dev/null 2>&1 || true
          import os, json, base64, urllib.request, urllib.error
          T=os.environ['GH_TOKEN']; REPO=os.environ['GITHUB_REPOSITORY']
          H={'Authorization':'Bearer '+T,'Accept':'application/vnd.github+json',
             'User-Agent':'yuanbao','Content-Type':'application/json'}
          U='https://api.github.com/repos/'+REPO+'/contents/reactos/STEP3_LOG.txt'
          b=open('/tmp/ros/step3.log','rb').read()
          body={'message':'log do run '+os.environ.get('GITHUB_RUN_NUMBER','?'),
                'content':base64.b64encode(b).decode(),'branch':'main'}
          try:
              r=urllib.request.urlopen(urllib.request.Request(U+'?ref=main',headers=H),timeout=15)
              body['sha']=json.loads(r.read())['sha']
          except Exception: pass
          try:
              req=urllib.request.Request(U,data=json.dumps(body).encode(),headers=H,method='PUT')
              urllib.request.urlopen(req,timeout=20)
          except Exception as e: print('publicar log:',e)
          PY
          }
          trap PUBLICAR EXIT
          DIZ "=== inicio $(date -u +%H:%M:%S) ==="
          DIZ "ISO=$ISO"

          # Tailscale: FALHA AQUI NAO PODE derrubar o sistema operacional
          DIZ "=== tailscale ==="
          (curl -fsSL https://tailscale.com/install.sh | sh) >>"$LOG" 2>&1 \
            || DIZ "install.sh rc=$?"
          sudo tailscale up --authkey="$TS_KEY" --hostname=reactos-seu \
            >>"$LOG" 2>&1 || DIZ "tailscale up FALHOU rc=$?"
          TS_IP=""
          for i in $(seq 1 30); do
            TS_IP=$(tailscale ip -4 2>>"$LOG" | head -1 || true)
            [ -n "$TS_IP" ] && break
            sleep 3
          done
          if [ -z "$TS_IP" ]; then
            TS_IP="SEM_TAILSCALE"
            DIZ "AVISO: sem IP de tailnet — ReactOS continua de pe, sem acesso remoto"
          fi
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          DIZ "TS_IP=$TS_IP"
          tailscale status >>"$LOG" 2>&1 || true

          # QEMU: aceleracao TCG pura, sem /dev/kvm
          DIZ "=== qemu ==="
          rm -f /tmp/ros/mon.sock /tmp/ros/qemu.pid
          qemu-system-x86_64 \
            -name 'ReactOS-do-baby' \
            -m 512 -smp 1 -accel tcg \
            -cdrom "$ISO" -hda /tmp/ros/disco.qcow2 -boot d \
            -device rtl8139,netdev=n0 -netdev user,id=n0 \
            -vnc 127.0.0.1:0 \
            -monitor unix:/tmp/ros/mon.sock,server=on,wait=off \
            -daemonize -pidfile /tmp/ros/qemu.pid >>"$LOG" 2>&1
          DIZ "qemu rc=$?"
          sleep 5
          if [ -f /tmp/ros/qemu.pid ]; then
            DIZ "qemu_pid: $(cat /tmp/ros/qemu.pid)"
          else
            DIZ "QEMU_NAO_SUBIU"; tail -30 "$LOG"; exit 1
          fi

          # noVNC: bind no IP da tailnet (ou so localhost se Tailscale falhou)
          BIND="$TS_IP"
          [ "$BIND" = "SEM_TAILSCALE" ] && BIND="127.0.0.1"
          DIZ "=== websockify em $BIND:6080 ==="
          nohup websockify --web=/usr/share/novnc \
            "$BIND:6080" 127.0.0.1:5900 \
            > /tmp/ros/websockify.log 2>&1 &
          sleep 3
          ss -ltn >>"$LOG" 2>&1 || true
          DIZ "portas: $(ss -ltn | grep -E '5900|6080' | tr '\n' ' ')"
          DIZ "vnc_publico: NAO (bind 127.0.0.1:5900)"

      - name: ecoar diagnostico (nunca falha)
        if: always()
        run: |
          set +e
          echo "=== DIAGNOSTICO run ${{ github.run_number }} ==="
          echo "kvm: $(ls -l /dev/kvm 2>&1 | head -1)"
          echo "qemu: $(qemu-system-x86_64 --version 2>&1 | head -1)"
          echo "--- step3.log ---"
          tail -80 /tmp/ros/step3.log 2>/dev/null
          echo "--- websockify.log ---"
          tail -20 /tmp/ros/websockify.log 2>/dev/null
          echo "--- portas ---"
          ss -ltn 2>/dev/null | grep -E '5900|6080' || true
          exit 0

      - name: esperar boot e capturar a tela real
        run: |
          set -euo pipefail
          python3 reactos/screendump.py
          ls -l /tmp/ros/frame.png
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/ros/frame.png').convert('RGB')
          print('frame:', im.size, 'extremos:', im.getextrema())
          PY

      - name: artefato da tela
        uses: actions/upload-artifact@v4
        with:
          name: reactos-tela
          path: /tmp/ros/frame.png
          if-no-files-found: ignore

      - name: publicar endereco e prova (via API, sem git push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, urllib.request, datetime
          T = os.environ['GH_TOKEN']; REPO = os.environ['GITHUB_REPOSITORY']
          IP = os.environ.get('TS_IP', 'SEM_TAILSCALE')
          H = {'Authorization':'Bearer '+T,
               'Accept':'application/vnd.github+json',
               'User-Agent':'yuanbao','Content-Type':'application/json'}
          BASE = 'https://api.github.com/repos/'+REPO+'/contents/'

          def put(path, data, msg):
              u = BASE + path
              body = {'message': msg,
                      'content': base64.b64encode(data).decode(),
                      'branch': 'main'}
              try:
                  r = urllib.request.urlopen(
                      urllib.request.Request(u+'?ref=main', headers=H), timeout=15)
                  body['sha'] = json.loads(r.read())['sha']
              except Exception:
                  pass
              req = urllib.request.Request(
                  u, data=json.dumps(body).encode(), headers=H, method='PUT')
              with urllib.request.urlopen(req, timeout=30) as x:
                  print('publicado', path, x.status)

          png = open('/tmp/ros/frame.png','rb').read()
          from PIL import Image
          im = Image.open('/tmp/ros/frame.png').convert('RGB')
          ext = im.getextrema()

          txt = f"""# REACTOS 0.4.16 — 100% CODIGO ABERTO, 100% SEU
          data      : {datetime.datetime.utcnow().isoformat()}Z
          run       : {os.environ.get('GITHUB_RUN_NUMBER','?')}
          SO        : ReactOS 0.4.16 (GPLv2/LGPLv2) — compativel com Windows NT
          licenca   : NENHUMA da Microsoft. Nao e Windows, nao precisa de chave.
          host      : {IP}
          browser   : http://{IP}:6080/vnc.html
          vnc       : {IP}:5900 (sem senha; so a sua tailnet alcanca)
          tela      : {im.size[0]}x{im.size[1]}  png={len(png)} bytes
          pixels    : min={ext[0][0]} max={ext[0][1]} (prova de que nao e tela preta)
          disco     : /tmp/ros/disco.qcow2 (2G, efemero neste runner)
          validade  : ~5h50 (teto do Actions); renovacao encadeada aos 300 min
          hardware  : runner da Microsoft. O SISTEMA e seu; o ferro, nao.
          """
          print(txt)
          put('reactos/CONECTAR_REACTOS.txt', txt.encode(), 'ReactOS endereco '+IP)
          put('reactos/ULTIMA_TELA.png', png, 'ReactOS tela real '+IP)
          PY

      - name: coracao + renovacao encadeada (relogio real)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INICIO=$(date +%s)
          while true; do
            MIN=$(( ($(date +%s) - INICIO) / 60 ))
            IP=$(tailscale ip -4 2>/dev/null | head -1 || true)
            PID=$(cat /tmp/ros/qemu.pid 2>/dev/null || echo 0)
            VIVO=no
            [ "$PID" != "0" ] && kill -0 "$PID" 2>/dev/null && VIVO=sim
            echo "$(date -u +%H:%M:%S) min=$MIN ip=$IP qemu=$VIVO"
            if [ "$VIVO" != sim ]; then
              echo "QEMU caiu — religando"
              qemu-system-x86_64 -m 512 -smp 1 -accel tcg \
                -cdrom "$ISO" -hda /tmp/ros/disco.qcow2 -boot d \
                -device rtl8139,netdev=n0 -netdev user,id=n0 \
                -vnc 127.0.0.1:0 -daemonize \
                -pidfile /tmp/ros/qemu.pid || true
            fi
            if [ "$MIN" -ge 300 ]; then
              echo "300 min — despachando sucessor"
              gh workflow run reactos.yml \
                --repo "${{ github.repository }}" --ref main || true
              exit 0
            fi
            sleep 60
          done

